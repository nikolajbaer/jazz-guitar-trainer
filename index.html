<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jazz Guitar Woodshed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a lead sheet on top, a practice notebook under it, the rhythm section docked at the bottom edge. */
:root{
  --paper:#eef1f7; --surface:#ffffff; --ink:#10203f; --muted:#586684; --line:#cdd5e5;
  --blue:#1746c8; --blue-soft:#dfe7fb; --brass:#c98a1b; --brass-soft:#f8e6c2; --on-accent:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0a1124; --surface:#121c37; --ink:#e7ecfa; --muted:#93a0c2; --line:#273659;
  --blue:#86a4ff; --blue-soft:#1c2b57; --brass:#eab353; --brass-soft:#4a3a17; --on-accent:#0a1124; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0a1124; --surface:#121c37; --ink:#e7ecfa; --muted:#93a0c2; --line:#273659;
  --blue:#86a4ff; --blue-soft:#1c2b57; --brass:#eab353; --brass-soft:#4a3a17; --on-accent:#0a1124; color-scheme:dark }

*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:800 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--blue)}
.brand span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.picks{display:grid;grid-template-columns:1fr auto;gap:8px}
.picks label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:0}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 8px;font-size:15px;min-width:0;max-width:100%}

h2{font:800 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;padding:4px 0;color:var(--blue);font-size:13px;text-decoration:underline}

/* lead sheet */
.chart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.bar{display:flex;min-width:0;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--surface);position:relative;min-height:56px}
.bar small{position:absolute;top:1px;left:3px;font:400 9px var(--mono);color:var(--muted);pointer-events:none}
.ch{flex:1 1 0;min-width:0;background:none;border:0;padding:12px 2px 6px;font:800 22px/1 var(--display);letter-spacing:.01em;white-space:nowrap;border-radius:0}
.ch i{font:600 .62em var(--display);font-style:normal;vertical-align:.35em;margin-left:1px}
.bar.two .ch{font-size:17px}
.bar.four .ch{font-size:13px}
.ch.sel{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue)}
.ch.now{background:var(--brass);color:var(--on-accent)}

/* live strip */
.live{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.live p{margin:0;font-size:13px;color:var(--muted)}
.live p b{font:800 18px var(--display);color:var(--ink);letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--blue-soft);color:var(--ink);border:1px solid transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}
.chip:active{border-color:var(--blue)}
.chip.best{background:var(--blue);color:var(--on-accent)}

/* notebook */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:2px solid var(--ink)}
.tab{background:none;border:0;padding:9px 2px;font:600 15px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--on-accent);background:var(--ink)}
:root .tab[aria-selected="true"]{color:var(--paper)}
.panel{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.note{margin:0;font-size:13px;color:var(--muted);max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.voic{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.voic span{font-size:11px;color:var(--muted);line-height:1.25}
.voic svg{width:100%;max-width:120px;height:auto}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.row h3{margin:0;font:800 18px var(--display);letter-spacing:.02em}
.row h3 em{font:500 12px var(--body);font-style:normal;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.row p{margin:0;font-size:13px;color:var(--muted);grid-column:1}
.use{grid-row:1/span 2;grid-column:2;background:var(--blue);color:var(--on-accent);border:0;border-radius:6px;padding:9px 12px;font-weight:600;font-size:13px}
.ghost{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600}
.vl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.vl b{font-family:var(--mono);font-weight:500}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;max-width:320px}
.pair > b{font:800 22px var(--display);color:var(--brass)}
h4{margin:6px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lick{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lick header{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
.lick h3{margin:0;font:800 17px var(--display);letter-spacing:.02em}
.tabwrap{overflow-x:auto}
pre{margin:0;font:400 12px/1.25 var(--mono);color:var(--ink)}

/* chord + fretboard drawings */
svg .ln{stroke:var(--ink);stroke-width:1;fill:none}
svg .nut{stroke:var(--ink);stroke-width:3}
svg .dot{fill:var(--ink)}
svg .dot.rt{fill:var(--blue)}
svg .dot.sc{fill:var(--surface);stroke:var(--ink);stroke-width:1.3}
svg text{font:500 10px var(--mono);fill:var(--muted);text-anchor:middle}
svg text.in{fill:var(--surface);font-weight:500}
svg text.in.dk{fill:var(--ink)}

/* rhythm section dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
#play{grid-row:1/span 2;width:60px;height:60px;border-radius:50%;border:0;background:var(--brass);color:var(--ink);font:800 15px var(--display);letter-spacing:.06em;text-transform:uppercase}
:root #play{color:#10203f}
.tempo{display:flex;align-items:center;gap:10px;min-width:0}
.tempo input{flex:1;min-width:0;accent-color:var(--brass)}
.tempo output{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mix{display:flex;gap:6px;flex-wrap:wrap}
.mix button{background:none;border:1px solid var(--muted);color:var(--paper);opacity:.55;border-radius:999px;padding:4px 11px;font-size:12px}
.mix button[aria-pressed="true"]{opacity:1;border-color:var(--brass);color:var(--brass)}

/* scale sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,25,.55)}
.sheet-in{background:var(--surface);color:var(--ink);width:100%;max-width:720px;max-height:92%;overflow:auto;border-top:4px solid var(--blue);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{font-size:26px}
.sheet .notes{font:500 14px var(--mono);margin:0}
.sheet .notes span{color:var(--muted);font-size:11px;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl output{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--ink)}
.legend i.rt{background:var(--blue)} .legend i.sc{background:var(--surface);border:1.3px solid var(--ink)}
.fb{width:100%;height:auto;max-width:520px}
@media (prefers-reduced-motion: no-preference){ .ch{transition:background .08s} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand"><h1>Woodshed</h1><span>Jazz guitar practice</span></div>
    <div class="picks">
      <label for="prog">Changes<select id="prog"></select></label>
      <label for="key">Key<select id="key"></select></label>
    </div>
  </header>

  <section>
    <div class="sec-head"><h2 id="chartTitle">Chart</h2><button class="link" id="reset" hidden>Reset chart</button></div>
    <p class="note" id="progNote" style="margin:4px 0 8px"></p>
    <div class="chart" id="chart"></div>
  </section>

  <section class="live" id="live" aria-live="polite"></section>

  <section>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="voic">Fingerings</button>
      <button class="tab" role="tab" data-tab="subs">Subs</button>
      <button class="tab" role="tab" data-tab="next">Next chord</button>
      <button class="tab" role="tab" data-tab="licks">Licks</button>
    </div>
    <div class="panel" id="panel"></div>
  </section>
</div>

<div class="dock">
  <div class="dock-in">
    <button id="play" aria-label="Play the changes">Play</button>
    <div class="tempo"><input id="tempo" type="range" min="60" max="220" step="2" value="120" aria-label="Tempo"><output id="bpm">120 bpm</output></div>
    <div class="mix" id="mix">
      <button data-m="piano" aria-pressed="true">Piano</button>
      <button data-m="bass" aria-pressed="true">Bass</button>
      <button data-m="drums" aria-pressed="true">Drums</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>

<script>
const $=s=>document.querySelector(s);
const mod=n=>((n%12)+12)%12;
const X=null;

/* ---------- theory ---------- */
const FLAT=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const SHARP={6:'F♯',1:'C♯',8:'G♯',3:'D♯',10:'A♯'};
const KEY_SHARPS={7:[6],2:[6,1],9:[6,1,8],4:[6,1,8,3],11:[6,1,8,3,10]};
const Q={
  maj7:{sym:'maj7',iv:[0,4,7,11],g:[4,11],fam:'maj'},
  '6':{sym:'6',iv:[0,4,7,9],g:[4,9],fam:'maj'},
  '69':{sym:'6/9',iv:[0,4,7,9,14],g:[4,9],fam:'maj'},
  '7':{sym:'7',iv:[0,4,7,10],g:[4,10],fam:'dom'},
  '9':{sym:'9',iv:[0,4,7,10,14],g:[4,10],fam:'dom'},
  '13':{sym:'13',iv:[0,4,10,14,21],g:[4,10],fam:'dom'},
  '7b9':{sym:'7♭9',iv:[0,4,7,10,13],g:[4,10],fam:'alt'},
  '7#9':{sym:'7♯9',iv:[0,4,7,10,15],g:[4,10],fam:'alt'},
  '7alt':{sym:'7alt',iv:[0,4,10,15,20],g:[4,10],fam:'alt'},
  '7sus4':{sym:'7sus',iv:[0,5,7,10],g:[5,10],fam:'sus'},
  m7:{sym:'m7',iv:[0,3,7,10],g:[3,10],fam:'min'},
  m9:{sym:'m9',iv:[0,3,7,10,14],g:[3,10],fam:'min'},
  m6:{sym:'m6',iv:[0,3,7,9],g:[3,9],fam:'tmin'},
  mMaj7:{sym:'m(maj7)',iv:[0,3,7,11],g:[3,11],fam:'tmin'},
  m7b5:{sym:'m7♭5',iv:[0,3,6,10],g:[3,10],fam:'hdim'},
  dim7:{sym:'°7',iv:[0,3,6,9],g:[3,9],fam:'dim'}
};
const isDom=c=>['dom','alt','sus'].includes(Q[c.q].fam);
const isMinor=c=>['min','tmin'].includes(Q[c.q].fam);

const SCALES={
  ionian:{n:'Major (Ionian)',s:[0,2,4,5,7,9,11],w:'Home base. Go easy on the 4th, it rubs against the 3rd.'},
  lydian:{n:'Lydian',s:[0,2,4,6,7,9,11],w:'Raises the 4th so every note can ring over the chord. The modern major sound.'},
  majpent:{n:'Major pentatonic',s:[0,2,4,7,9],w:'No avoid notes at all. Gives a 6/9 sound.'},
  majbebop:{n:'Major bebop',s:[0,2,4,5,7,8,9,11],w:'Adds a passing ♯5 so chord tones land on the beat in eighth-note lines.'},
  mixo:{n:'Mixolydian',s:[0,2,4,5,7,9,10],w:'The plain dominant scale. Start here.'},
  dombebop:{n:'Bebop dominant',s:[0,2,4,5,7,9,10,11],w:'Mixolydian plus a passing natural 7. Play it downward from the root.'},
  lyddom:{n:'Lydian dominant',s:[0,2,4,6,7,9,10],w:'♯11 colour. Best on dominants that do not resolve down a fifth, and on tritone subs.'},
  blues:{n:'Blues scale',s:[0,3,5,6,7,10],w:'Minor pentatonic plus the ♭5. Works over the whole blues form.'},
  majblues:{n:'Major blues',s:[0,2,3,4,7,9],w:'Major pentatonic plus the ♭3. Sweeter than the minor blues scale.'},
  hwdim:{n:'Half–whole diminished',s:[0,1,3,4,6,7,9,10],w:'♭9, ♯9 and ♯11 with a natural 13. Great on 7♭9 and 13♭9.'},
  altered:{n:'Altered',s:[0,1,3,4,6,8,10],w:'Every tension altered. Use it on a V7 that resolves to its I, especially in minor.'},
  phrdom:{n:'Phrygian dominant',s:[0,1,4,5,7,8,10],w:'Harmonic minor of the chord you are resolving to. The classic minor-key V sound.'},
  whole:{n:'Whole tone',s:[0,2,4,6,8,10],w:'♯5 and ♯11 with a natural 9. Floating and ambiguous.'},
  dorian:{n:'Dorian',s:[0,2,3,5,7,9,10],w:'The default minor 7 scale. The natural 6 keeps it bright.'},
  minpent:{n:'Minor pentatonic',s:[0,3,5,7,10],w:'Five safe notes you already know from blues and rock.'},
  aeolian:{n:'Natural minor (Aeolian)',s:[0,2,3,5,7,8,10],w:'Darker than Dorian. Fits a minor chord acting as vi or as the tonic.'},
  melmin:{n:'Melodic minor',s:[0,2,3,5,7,9,11],w:'The jazz tonic-minor sound, with natural 6 and 7.'},
  harmin:{n:'Harmonic minor',s:[0,2,3,5,7,8,11],w:'Keeps the leading tone but with a dark ♭6.'},
  locrian:{n:'Locrian',s:[0,1,3,5,6,8,10],w:'The scale the chord comes from. Avoid sitting on the ♭2.'},
  loc2:{n:'Locrian ♮2',s:[0,2,3,5,6,8,10],w:'Sixth mode of melodic minor. The natural 9 is a prettier colour.'},
  whdim:{n:'Whole–half diminished',s:[0,2,3,5,6,8,9,11],w:'Chord tones plus a whole step above each one.'},
  pent5:{n:'Minor pentatonic from the 5th',s:[0,3,5,7,10],from:7,w:'Outlines the sus sound: 5, ♭7, root, 9, 4.'}
};
const FAM_SCALES={
  maj:['ionian','lydian','majpent','majbebop'],
  dom:['mixo','dombebop','blues','majblues','lyddom','hwdim'],
  alt:['altered','hwdim','phrdom','whole'],
  sus:['mixo','pent5'],
  min:['dorian','minpent','blues','aeolian'],
  tmin:['melmin','dorian','harmin','minpent'],
  hdim:['locrian','loc2'],
  dim:['whdim']
};

/* voicing shapes: fret offsets from the root fret, strings low E to high e; fingers 0 = not played */
const SHAPES={
  maj7:[[6,'shell',[0,X,1,1,X,X],[1,0,2,3,0,0]],[6,'',[0,X,1,1,0,X],[1,0,3,4,2,0]],[5,'',[X,0,2,1,2,X],[0,1,3,2,4,0]],[4,'',[X,X,0,2,2,2],[0,0,1,3,3,3]]],
  '6':[[6,'',[0,X,-1,1,0,X],[2,0,1,4,3,0]],[5,'',[X,0,-1,-1,-2,X],[0,4,2,3,1,0]],[4,'',[X,X,0,2,0,2],[0,0,1,3,1,4]]],
  '69':[[5,'',[X,0,-1,-1,0,0],[0,2,1,1,3,4]],[6,'',[0,-1,-1,-1,0,0],[2,1,1,1,3,4]]],
  '7':[[6,'shell',[0,X,0,1,X,X],[1,0,2,3,0,0]],[6,'',[0,X,0,1,0,X],[1,0,1,2,1,0]],[5,'',[X,0,2,0,2,X],[0,1,3,1,4,0]],[4,'',[X,X,0,2,1,2],[0,0,1,3,2,4]]],
  '9':[[5,'',[X,0,-1,0,0,X],[0,2,1,3,3,0]],[6,'',[0,X,0,1,0,2],[1,0,1,2,1,4]]],
  '13':[[6,'',[0,X,0,1,2,X],[1,0,2,3,4,0]],[5,'',[X,0,-1,0,0,2],[0,2,1,3,3,4]]],
  '7b9':[[5,'',[X,0,-1,0,-1,X],[0,2,1,3,1,0]],[6,'',[0,X,0,1,0,1],[1,0,1,2,1,3]]],
  '7#9':[[5,'',[X,0,-1,0,1,X],[0,2,1,3,4,0]],[6,'♭13',[0,X,0,1,1,X],[1,0,1,2,3,0]]],
  '7alt':[[5,'♯9 ♯5',[X,0,-1,0,1,1],[0,2,1,3,4,4]],[6,'♭13',[0,X,0,1,1,X],[1,0,1,2,3,0]],[5,'♭9',[X,0,-1,0,-1,X],[0,2,1,3,1,0]]],
  '7sus4':[[6,'',[0,X,0,2,0,X],[1,0,1,3,1,0]],[5,'',[X,0,2,0,3,X],[0,1,3,1,4,0]]],
  m7:[[6,'shell',[0,X,0,0,X,X],[2,0,3,4,0,0]],[6,'',[0,X,0,0,0,X],[2,0,3,3,3,0]],[5,'',[X,0,2,0,1,X],[0,1,3,1,2,0]],[4,'',[X,X,0,2,1,1],[0,0,1,3,2,2]]],
  m9:[[5,'',[X,0,-2,0,0,X],[0,2,1,3,4,0]],[6,'',[0,X,0,0,0,2],[1,0,1,1,1,4]]],
  m6:[[6,'',[0,X,-1,0,0,X],[2,0,1,3,4,0]],[5,'',[X,0,-2,-1,-2,X],[0,4,1,2,1,0]],[4,'',[X,X,0,2,0,1],[0,0,1,3,1,2]]],
  mMaj7:[[6,'',[0,X,1,0,0,X],[1,0,2,1,1,0]],[5,'',[X,0,2,1,1,X],[0,1,4,2,3,0]]],
  m7b5:[[6,'',[0,X,0,0,-1,X],[2,0,3,4,1,0]],[5,'',[X,0,1,0,1,X],[0,1,3,2,4,0]],[4,'',[X,X,0,1,1,1],[0,0,1,2,2,2]]],
  dim7:[[6,'',[0,X,-1,0,-1,X],[2,0,1,3,1,0]],[5,'',[X,0,1,-1,1,X],[0,2,3,1,4,0]],[4,'',[X,X,0,1,0,1],[0,0,1,3,2,4]]]
};
const OPEN=[40,45,50,55,59,64];
const ORD={6:'6th',5:'5th',4:'4th'};

/* licks: semitone offsets from the anchor root, all swung eighths, then one held note */
const LICKS=[
  {fam:['dom','sus'],name:'Bebop scale descent',tip:'The passing natural 7 keeps chord tones on the beat.',n:[12,11,10,9,7,5,4,2],end:0},
  {fam:['dom','alt'],name:'3rd up to the ♭9',tip:'Arpeggiate 3–5–♭7–♭9, then fall back down the scale.',n:[4,7,10,13,12,10,9,7],end:4},

/* tab */
function place(p){
  for(const w of [4,5,6]) for(let base=1;base<=14;base++){
    const out=[];let ok=true;
    for(const n of p){let best=null;for(let s=0;s<6;s++){const f=n-OPEN[s];if(f>=base&&f<=base+w&&(!best||f<best.f)) best={s,f};}
      if(!best){ok=false;break;} out.push(best);}
    if(ok) return out;
  }
  return p.map(n=>{let s=5;while(s>0&&n-OPEN[s]<0)s--;return {s,f:Math.max(0,n-OPEN[s])};});
}

    else chg('51',c.r,`Resolving to ${cname(next)}`,isMinor(next),next.q);
  }
  if(fam==='maj'&&isDom(next)&&mod(next.r-c.r)===9&&list[k].len===2) chg('turn',c.r,'Over the turnaround');
  LICKS.filter(l=>l.fam&&l.fam.includes(fam)).forEach(l=>out.push({l,anchor:pcOf(c),title:`Over ${cname(c)}`,labels:[[0,cname(c)]]}));
  return out;
}

/* ---------- render ---------- */
function renderPickers(){
  const groups={};PROGS.forEach(p=>(groups[p.g]=groups[p.g]||[]).push(p));
  $('#prog').innerHTML=Object.entries(groups).map(([g,ps])=>`<optgroup label="${g}">${ps.map(p=>`<option value="${p.id}"${p===S.prog?' selected':''}>${p.n}</option>`).join('')}</optgroup>`).join('');
  $('#key').innerHTML=FLAT.map((n,i)=>`<option value="${i}"${i===S.key?' selected':''}>${n}${S.prog.minor?' minor':''}</option>`).join('');
}
function renderChart(){
  const f=flat();
  $('#chartTitle').textContent=`${S.prog.n} in ${FLAT[S.key]}${S.prog.minor?' minor':''}`;
  $('#progNote').textContent=S.prog.note+' Tap any chord to study it.';
  $('#chart').innerHTML=S.bars.map((bar,b)=>`<div class="bar${bar.length===2?' two':bar.length>2?' four':''}"><small>${b+1}</small>${bar.map((c,i)=>{
    const k=f.list.findIndex(e=>e.b===b&&e.i===i);
    return `<button class="ch${S.sel.b===b&&S.sel.i===i?' sel':''}${k===S.cur?' now':''}" data-b="${b}" data-i="${i}" data-k="${k}">${chtml(c)}</button>`;}).join('')}</div>`).join('');
  $('#reset').hidden=JSON.stringify(S.bars)===JSON.stringify(parse(S.prog.c));
}
let liveKey='';
function renderLive(force){
  const f=flat(), playing=S.playing&&S.cur>=0&&f.list[S.cur];
  const c=playing?f.list[S.cur].c:selChord();
  const nxt=playing?f.list[(S.cur+1)%f.list.length].c:around(S.sel.b,S.sel.i).next;
  const key=(playing?'p':'s')+c.r+c.q+nxt.r+nxt.q+S.key;
  if(key===liveKey&&!force) return; liveKey=key;
  const ids=FAM_SCALES[Q[c.q].fam].slice();
  if(S.prog.blues&&!S.prog.minor&&Q[c.q].fam==='maj') ids.push('majblues');
  $('#live').innerHTML=`<p>${playing?'Now playing':'Scales for'} <b>${cname(c)}</b> ${playing?`· next ${cname(nxt)}`:''}</p>
    <div class="chips">${ids.map((id,j)=>`<button class="chip${j===0?' best':''}" data-scale="${id}" data-r="${c.r}" data-q="${c.q}">${nm(pcOf(c)+(SCALES[id].from||0))} ${SCALES[id].n}</button>`).join('')}</div>
    <p>Tap a scale to see where it sits on the neck.</p>`;
}
function renderPanel(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===S.tab));
  const c=selChord(), {b,i}=S.sel, {next}=around(b,i); let h='';
  if(S.tab==='voic'){
    const tones=Q[c.q].iv.map(x=>nm(pcOf(c)+x)).join(' · ');
    h=`<p class="note"><b>${cname(c)}</b> is ${tones}. Numbers are left-hand fingers, the blue dot is the root. Tap a shape to hear it.</p>
       <div class="grid">${voicings(c).map((v,j)=>`<button class="voic" data-strum="${j}">${chordSvg(v)}<span>${v.label}</span></button>`).join('')}</div>
       <p class="note">Shell shapes (root, 3rd, 7th) leave fingers free and stay out of a bass player's way.</p>`;
  } else if(S.tab==='subs'){
    S.subs=subsFor(c,b,i);
    h=`<p class="note">Swap <b>${cname(c)}</b> for one of these. The chart and the backing track update straight away.</p>`+
      S.subs.map((s,j)=>`<div class="row"><h3><em>${s.t}</em>${s.chs.map(cname).join(' – ')}</h3><p>${s.why}</p><button class="use" data-sub="${j}">Use it</button></div>`).join('');
  } else if(S.tab==='next'){
    const va=voicings(c), vb=voicings(next); let best=null;
    va.forEach(x=>vb.forEach(y=>{const d=Math.abs(x.pos-y.pos)+(x.root===y.root?1.5:0);if(!best||d<best.d) best={d,x,y};}));
    S.ways=waysTo(c,b,i);
    h=`<p class="note">Getting from <b>${cname(c)}</b> to <b>${cname(next)}</b>. Follow the 3rd and 7th: they carry the harmony.</p>
       <ul class="vl">${guideLines(c,next)}</ul>
       <h4>Closest pair of shapes</h4>
       <div class="pair"><div class="voic">${chordSvg(best.x)}<span>${cname(c)}</span></div><b>→</b><div class="voic">${chordSvg(best.y)}<span>${cname(next)}</span></div></div>
       <h4>Add a connecting chord</h4>`+
      (S.ways?S.ways.map((s,j)=>`<div class="row"><h3><em>${s.t}</em>${s.chs.map(cname).join(' – ')}</h3><p>${s.why}</p><button class="use" data-way="${j}">Use it</button></div>`).join('')
       :`<p class="note">${cname(c)} only lasts two beats here, so there is no room for another chord. Use the voice leading above.</p>`);
  } else {
    S.licks=licksFor(c,b,i); let last='';
    h=`<p class="note">Licks are shown in tab for this key, in swung eighth notes. Each one ends on a held note.</p>`+
      S.licks.map((x,j)=>{const head=x.title!==last?`<h4>${x.title}</h4>`:'';last=x.title;
        return `${head}<div class="lick"><header><h3>${x.l.name}</h3><button class="ghost" data-lick="${j}">Hear it</button></header>
        <div class="tabwrap"><pre>${tabText(x.l,x.anchor,x.labels,x.minorRes)}</pre></div><p class="note">${x.l.tip}</p></div>`;}).join('');
  }
  $('#panel').innerHTML=h;
}
function renderAll(){renderChart();renderLive(true);renderPanel();}
function loadProg(p,keepKey){S.prog=p;if(!keepKey)S.key=p.key;S.bars=parse(p.c);S.sel={b:0,i:0};S.cur=-1;beatNo=0;uiQ.length=0;renderPickers();renderAll();save();}

/* scale sheet */
let sheet=null;
function openSheet(id,c){
  const sc=SCALES[id], pcs=scalePcs(c,sc), ps=positions(pcs);
  const rf=mod(pcOf(c)-4)||12; let p=ps.filter(x=>x<=rf).pop()||ps[0];
  sheet={id,c,ps,p,mode:(sheet&&sheet.mode)||'fingers'}; drawSheet(); $('#sheet').hidden=false;
}
function degree(x,s){x=mod(x);const has=n=>s.some(v=>mod(v)===n);
  if(x===6) return has(4)&&!has(5)?'♯4':'♭5'; if(x===8) return has(4)&&!has(7)?'♯5':'♭6';
  return ['1','♭2','2','♭3','3','4','','5','','6','♭7','7'][x];}
function drawSheet(){
  const {id,c,ps,p,mode}=sheet, sc=SCALES[id], off=sc.from||0, k=ps.indexOf(p);
  $('#sheetIn').innerHTML=`<div class="sec-head"><h2>${nm(pcOf(c)+off)} ${sc.n}</h2><button class="ghost" data-x="close">Close</button></div>
    <p class="note">Over <b>${cname(c)}</b>. ${sc.w}</p>
    <p class="notes">${sc.s.map(x=>nm(pcOf(c)+off+x)).join('  ')}<span>${sc.s.map(x=>degree(x+off,sc.s.map(v=>v+off))).join('  ')} &nbsp;(against the chord root)</span></p>
    ${fretboardSvg(c,sc,p,mode)}
    <div class="legend"><span><i class="rt"></i>Chord root</span><span><i></i>Chord tone</span><span><i class="sc"></i>Other scale note</span></div>
    <div class="ctl">
      <button class="ghost" data-x="down"${k<=0?' disabled':''}>◀ Lower</button>
      <output>Position ${k+1} of ${ps.length}, fret ${p}</output>
      <button class="ghost" data-x="up"${k>=ps.length-1?' disabled':''}>Higher ▶</button>
    </div>
    <div class="ctl">
      <button class="ghost" data-x="mode">${mode==='fingers'?'Show note names':'Show fingers'}</button>
      <button class="ghost" data-x="hear">Hear the scale</button>
    </div>
    <p class="note">Numbers are left-hand fingers with the index at fret ${p}. Where a string has three notes spread over five frets, stretch or shift.</p>`;
}

/* ---------- audio ---------- */
let ctx,bus={},noise,timer=null,beatNo=0,beatTime=0;const uiQ=[];
function audio(){
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
    for(const [k,v] of Object.entries({piano:.5,bass:.75,drums:.5,lead:.6})){bus[k]=ctx.createGain();bus[k].gain.value=v;bus[k].connect(comp);}
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ctx.state!=='running') ctx.resume();
  return ctx;
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(out,m,t,dur,vel,kind){
  const g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';
  const cfg={piano:{w:['triangle','sine'],r:[1,2],a:[1,.3],f0:3200,f1:900,dec:.6,sus:.25},
             bass:{w:['triangle','sine'],r:[1,1],a:[.8,.8],f0:700,f1:260,dec:.35,sus:.4},
             lead:{w:['sawtooth','triangle'],r:[1,1],a:[.35,.7],f0:2600,f1:700,dec:.3,sus:.3}}[kind];
  lp.frequency.setValueAtTime(cfg.f0,t);lp.frequency.exponentialRampToValueAtTime(cfg.f1,t+cfg.dec);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vel,t+.006);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,vel*cfg.sus),t+cfg.dec);
  g.gain.setValueAtTime(Math.max(.0002,vel*cfg.sus),t+Math.max(dur,cfg.dec));
  g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,cfg.dec)+.18);
  cfg.w.forEach((w,i)=>{const o=ctx.createOscillator(),og=ctx.createGain();o.type=w;o.frequency.value=hz(m)*cfg.r[i];o.detune.value=i*4;og.gain.value=cfg.a[i];
    o.connect(og);og.connect(lp);o.start(t);o.stop(t+Math.max(dur,cfg.dec)+.25);});
  lp.connect(g);g.connect(out);
}
function hit(t,type,vel){
  if(type==='kick'){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(vel,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(bus.drums);o.start(t);o.stop(t+.2);return;}
  const cfg={ride:{ft:'highpass',f:7000,a:.002,d:.42},hat:{ft:'highpass',f:9000,a:.001,d:.05},brush:{ft:'bandpass',f:2400,a:.03,d:.16}}[type];
  const src=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=noise;fl.type=cfg.ft;fl.frequency.value=cfg.f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vel,t+cfg.a);g.gain.exponentialRampToValueAtTime(.0001,t+cfg.a+cfg.d);
  src.connect(fl);fl.connect(g);g.connect(bus.drums);src.start(t,Math.random()*.4);src.stop(t+cfg.a+cfg.d+.05);
}
function pianoVoicing(c){
  const pc=pcOf(c),q=Q[c.q],out=[];
  q.g.forEach(g=>{let m=48+mod(pc+g);while(m<53)m+=12;out.push(m);});
  q.iv.filter(x=>x!==0&&!q.g.includes(x)).slice(0,2).forEach(x=>{let m=60+mod(pc+x);if(m<62)m+=12;out.push(m);});
  if(!S.mix.bass){let m=36+pc;if(m<43)m+=12;out.push(m);}
  return out;
}
const bassRoot=pc=>pc<=7?36+pc:24+pc;
function scheduleBeat(n,t){
  const f=flat(), pos=n%f.total, k=f.list.findIndex(e=>pos>=e.start&&pos<e.start+e.len), ev=f.list[k], nx=f.list[(k+1)%f.list.length];
  const j=pos-ev.start, inBar=pos%4, bd=60/S.tempo, sw=bd*2/3;
  uiQ.push({t,k});
  if(S.mix.drums){
    hit(t,'ride',inBar%2?.2:.15);
    if(inBar%2){hit(t+sw,'ride',.1);hit(t,'hat',.16);hit(t,'brush',.07);}
    if(inBar===0) hit(t,'kick',.3);
  }
  if(S.mix.bass){
    const pc=pcOf(ev.c), r=bassRoot(pc), iv=Q[ev.c.q].iv; let m=r;
    if(j===0) m=r;
    else if(j===ev.len-1){const nr=bassRoot(pcOf(nx.c));m=pcOf(nx.c)===pc?r+7:nr+(Math.random()<.5?1:-1);}
    else m=r+(j===1?iv[1]:(iv[2]>12?7:iv[2]));
    tone(bus.bass,m,t,bd*.9,.5,'bass');
  }
  if(S.mix.piano){
    const v=pianoVoicing(ev.c), play=(tt,d,vel)=>v.forEach((m,x)=>tone(bus.piano,m,tt+x*.006,d,vel*(.85+Math.random()*.15),'piano'));
    if(j===0) play(t,bd*Math.min(ev.len,1.4),.2);
    if(ev.len===4&&j===1) play(t+sw,bd*.9,.15);
  }
}
function tick(){
  while(beatTime<ctx.currentTime+.15){scheduleBeat(beatNo,beatTime);beatTime+=60/S.tempo;beatNo++;}
}
function frame(){
  if(!S.playing) return;
  let ch=false; while(uiQ.length&&uiQ[0].t<=ctx.currentTime){S.cur=uiQ.shift().k;ch=true;}
  if(ch){document.querySelectorAll('.ch').forEach(el=>el.classList.toggle('now',+el.dataset.k===S.cur));renderLive();}
  requestAnimationFrame(frame);
}
function start(){audio();S.playing=true;beatNo=0;beatTime=ctx.currentTime+.12;uiQ.length=0;tick();timer=setInterval(tick,25);
  $('#play').textContent='Stop';$('#play').setAttribute('aria-label','Stop');requestAnimationFrame(frame);}
function stop(){S.playing=false;clearInterval(timer);S.cur=-1;uiQ.length=0;$('#play').textContent='Play';$('#play').setAttribute('aria-label','Play the changes');renderChart();renderLive(true);}
function playLine(pitches,swing){
  audio();const bd=60/S.tempo;let t=ctx.currentTime+.06;
  pitches.forEach((m,x)=>{const last=x===pitches.length-1,d=swing?(x%2?bd/3:bd*2/3):bd/2;tone(bus.lead,m,t,last?bd*2:d*.95,.32,'lead');t+=d;});
}

/* ---------- events ---------- */
$('#prog').onchange=e=>loadProg(PROGS.find(p=>p.id===e.target.value));
$('#key').onchange=e=>{S.key=+e.target.value;save();renderAll();};
$('#reset').onclick=()=>{S.bars=parse(S.prog.c);S.sel={b:0,i:0};renderAll();};
$('#chart').onclick=e=>{const el=e.target.closest('.ch');if(!el)return;S.sel={b:+el.dataset.b,i:+el.dataset.i};renderAll();};
$('#tabs').onclick=e=>{const el=e.target.closest('.tab');if(!el)return;S.tab=el.dataset.tab;renderPanel();};
$('#live').onclick=e=>{const el=e.target.closest('.chip');if(el) openSheet(el.dataset.scale,{r:+el.dataset.r,q:el.dataset.q});};
$('#panel').onclick=e=>{
  const el=e.target.closest('button');if(!el)return;const d=el.dataset,{b,i}=S.sel;
  if(d.strum!=null){const v=voicings(selChord())[+d.strum];audio();let t=ctx.currentTime+.05;
    v.frets.forEach((f,s)=>{if(f!=null){tone(bus.lead,OPEN[s]+f,t,1.6,.22,'lead');t+=.045;}});}
  else if(d.sub!=null){S.bars[b].splice(i,1,...S.subs[+d.sub].chs.map(c=>({...c})));renderAll();}
  else if(d.way!=null){const w=S.ways[+d.way];S.bars[b]=(w.four?[w.chs[0],w.chs[0],w.chs[1],w.chs[2]]:w.chs).map(c=>({...c}));renderAll();}
  else if(d.lick!=null){const x=S.licks[+d.lick];playLine(lickPitches(x.l,x.anchor,x.minorRes),true);}
};
$('#sheet').onclick=e=>{
  if(e.target.id==='sheet'){$('#sheet').hidden=true;return;}
  const el=e.target.closest('button');if(!el)return;const x=el.dataset.x,k=sheet.ps.indexOf(sheet.p);
  if(x==='close'){$('#sheet').hidden=true;return;}
  if(x==='down') sheet.p=sheet.ps[k-1]; if(x==='up') sheet.p=sheet.ps[k+1];
  if(x==='mode') sheet.mode=sheet.mode==='fingers'?'notes':'fingers';
  if(x==='hear'){const sc=SCALES[sheet.id];let r=48+mod(pcOf(sheet.c)+(sc.from||0));const up=sc.s.map(v=>r+v);playLine([...up,r+12,...up.slice().reverse()],false);return;}
  drawSheet();
};
$('#play').onclick=()=>S.playing?stop():start();
$('#tempo').oninput=e=>{S.tempo=+e.target.value;$('#bpm').textContent=S.tempo+' bpm';save();};
$('#mix').onclick=e=>{const el=e.target.closest('button');if(!el)return;const m=el.dataset.m;S.mix[m]=!S.mix[m];el.setAttribute('aria-pressed',S.mix[m]);};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sheet').hidden=true;});

$('#tempo').value=S.tempo;$('#bpm').textContent=S.tempo+' bpm';
loadProg(S.prog,true);
</script>
</body>
</html>
